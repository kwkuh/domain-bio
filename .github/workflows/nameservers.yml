name: Nameservers

# External monitoring: query the PRODUCTION nameservers from outside, every 30 minutes.
# Not a unit test — this is what says "the service is up right now, or it is not".
#
# What one run does:
#   1. first prove the runner is fit to measure (outbound UDP/TCP 53, port 53 not hijacked);
#   2. discover the nameserver list from the parent delegation (adding ns2 needs no code change);
#   3. query each nameserver individually, UDP and TCP, IPv4 and IPv6;
#   4. healthy -> green badge and the incident issue is closed; sick -> red job, issue
#      opened, notification sent.
#
# The exit codes from monitor/check.js are deliberately distinct:
#   1 = the nameservers have a problem (this is an incident)
#   3 = RESULT INVALID, the runner's own network is dirty (an instrument problem, NOT an incident)

on:
  schedule:
    # Every 30 minutes. GitHub is often a few minutes late at busy hours, and that is
    # fine — what matters is not schedule precision but that something keeps looking.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      zones:
        description: "Zones to check (comma-separated)"
        default: "a-i.sh,a-i.st"
      nameservers:
        description: "Force the nameserver list, name@ip format (for a new ns not yet delegated)"
        default: ""
      transports:
        description: "Transports to test"
        default: "udp,tcp"
  push:
    # If the measuring instrument itself changes, prove it on the real path immediately.
    paths:
      - "monitor/**"
      - "src/**"
      - ".github/workflows/nameservers.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: nameservers
  cancel-in-progress: false

env:
  # The title is reused on purpose: one incident issue, reopened and closed, rather than
  # a new issue every 30 minutes. Both the opening and the closing step must agree on it,
  # so it lives here rather than being spelled out twice.
  INCIDENT_TITLE: "Nameservers have a problem"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Put at job level so it can be used in a step `if:` — the `secrets` context
    # is not available in a step `if:`, but `env` is.
    env:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      WA_WEBHOOK: ${{ secrets.WA_WEBHOOK }}
    outputs:
      status: ${{ steps.monitor.outputs.status }}
      summary: ${{ steps.monitor.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The assumption "a GitHub runner may send UDP 53 outbound" holds today, but must
      # not be trusted blindly: it is proven on every run. If GitHub (or an egress filter
      # such as harden-runner) ever closes port 53, this step goes red first and says why —
      # instead of the monitoring falsely accusing the nameserver of being down.
      - name: Prove the runner is fit to measure
        run: node monitor/capability.js

      - name: Check the production nameservers
        id: monitor
        env:
          ZONES: ${{ inputs.zones || 'a-i.sh,a-i.st' }}
          NAMESERVERS: ${{ inputs.nameservers || '' }}
          TRANSPORTS: ${{ inputs.transports || 'udp,tcp' }}
          # GitHub-hosted runners have no IPv6 route out. "auto" makes the v6 checks be
          # skipped with the reason recorded, not counted as failures. Switch to "on" if
          # this ever moves to a runner that genuinely has IPv6.
          IPV6: auto
          TIMEOUT: "4000"
          JSON_TO: result.json
        run: |
          set +e
          node monitor/check.js
          CODE=$?
          set -e
          case "$CODE" in
            0) STATUS=HEALTHY ;;
            1) STATUS=PROBLEMS ;;
            3) STATUS=INVALID ;;
            *) STATUS=ERROR ;;
          esac
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          # The keys here must match the ones check.js actually writes into result.json.
          # They were renamed together once and drifted anyway, and the failure is silent:
          # `${h.lulus||0}` on a file that no longer has that key reads as 0, so the summary
          # cheerfully reported "passed 0 failed 0" on a run where 218 checks passed.
          echo "summary=$(node -e 'const h=require("./result.json");console.log(`passed ${h.passed||0} failed ${h.failed||0}`)' 2>/dev/null || echo '-')" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "INVALID" ]; then
            echo "::error title=Instrument problem::The runner network hijacks or blocks port 53. This is NOT a sign the nameserver is down — this run is invalid."
          fi
          [ "$CODE" -eq 0 ]

      - name: Store the raw result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-result
          path: result.json
          retention-days: 30

      # A coloured README badge via shields.io "endpoint". Optional: if the secret
      # GIST_TOKEN is not set, this step is skipped and the README can keep using
      # GitHub's own badge (see docs/external-monitoring.md).
      - name: Update the badge (gist)
        if: always() && env.GIST_TOKEN != ''
        env:
          GIST_ID: ${{ vars.BADGE_GIST_ID }}
          STATUS: ${{ steps.monitor.outputs.status }}
          SUMMARY: ${{ steps.monitor.outputs.summary }}
        run: |
          case "$STATUS" in
            HEALTHY)  MESSAGE="up"; COLOR="brightgreen" ;;
            PROBLEMS) MESSAGE="down"; COLOR="red" ;;
            INVALID)  MESSAGE="unverified"; COLOR="lightgrey" ;;
            *)        MESSAGE="error"; COLOR="orange" ;;
          esac
          node -e '
            const [message, color] = process.argv.slice(1);
            const payload = JSON.stringify({ schemaVersion: 1, label: "nameservers", message, color });
            require("fs").writeFileSync("badge-payload.json", JSON.stringify({ files: { "nameservers.json": { content: payload } } }));
          ' "$MESSAGE" "$COLOR"
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" \
            -d @badge-payload.json > /dev/null

      # One incident issue, reused — not a new issue every 30 minutes.
      - name: Open or refresh the incident issue
        if: failure() && steps.monitor.outputs.status == 'PROBLEMS'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The label must be made to EXIST first. `gh issue create --label` fails
          # outright if the label was never created, and that failure means the incident
          # is never opened — an alarm that goes silent is more dangerous than no alarm
          # at all. This actually happened on the very first run (30687364149).
          gh label create monitoring --color B60205 \
            --description "Incidents from the scheduled nameserver monitoring" 2>/dev/null || true

          NUMBER=$(gh issue list --state open --label monitoring --json number,title \
            --jq ".[] | select(.title==\"$INCIDENT_TITLE\") | .number" | head -1)
          BODY="The scheduled monitoring failed. Details: $RUN"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "$BODY"
          else
            # If labelling still fails (a token without permission to create labels,
            # say), the issue MUST be opened anyway. An unlabelled incident is better
            # than no incident.
            gh issue create --title "$INCIDENT_TITLE" --label monitoring --body "$BODY" \
              || gh issue create --title "$INCIDENT_TITLE" --body "$BODY"
          fi

      - name: Close the incident issue once recovered
        if: success() && steps.monitor.outputs.status == 'HEALTHY'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deliberately NOT filtering by --label: if the labelling above failed, the
          # incident exists but carries no label, and a label filter would leave it
          # never closed — a ghost incident that sticks around forever. The title is
          # enough, and the title is reused on purpose.
          NUMBER=$(gh issue list --state open --json number,title \
            --jq ".[] | select(.title==\"$INCIDENT_TITLE\") | .number" | head -1)
          if [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" --comment "Recovered: the scheduled monitoring is green again."
          fi

      # A fast notification to WhatsApp through our own gateway (wafa.st / baleswa).
      # Deliberately separate from the INVALID condition: do not wake anyone at midnight
      # because the runner's own network was dirty.
      - name: Notify via WhatsApp
        if: failure() && steps.monitor.outputs.status == 'PROBLEMS' && env.WA_WEBHOOK != ''
        env:
          SUMMARY: ${{ steps.monitor.outputs.summary }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "$WA_WEBHOOK" \
            -H 'content-type: application/json' \
            -d "$(node -e 'console.log(JSON.stringify({ text: `Open-Domain: the nameservers have a problem (${process.env.SUMMARY}). ${process.env.RUN}` }))')" \
            > /dev/null
