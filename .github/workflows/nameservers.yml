name: Nameservers

# External monitoring: query the PRODUCTION nameservers from outside, every 30 minutes.
# Not a unit test — this is what says "the service is up right now, or it is not".
#
# Alur satu jalannya:
#   1. first prove the runner is fit to measure (outbound UDP/TCP 53, port 53 not hijacked);
#   2. temukan sendiri daftar nameserver dari delegasi induk (nambah ns2 = nol perubahan kode);
#   3. query each nameserver individually, UDP and TCP, IPv4 and IPv6;
#   4. sehat -> badge hijau & issue insiden ditutup; sakit -> job merah, issue dibuka, notif dikirim.
#
# Kode keluar dari monitor/check.js dibedakan sengaja:
#   1 = nameserver bermasalah (ini insiden)
#   3 = RESULT INVALID, the runner's own network is dirty (an instrument problem, NOT an incident)

on:
  schedule:
    # Tiap 30 menit. GitHub sering telat beberapa menit di jam sibuk — itu wajar,
    # what matters is not schedule precision but that something keeps looking.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      zones:
        description: "Zones to check (comma-separated)"
        default: "a-i.sh,a-i.st"
      nameservers:
        description: "Force the nameserver list, name@ip format (for a new ns not yet delegated)"
        default: ""
      transports:
        description: "Transports to test"
        default: "udp,tcp"
  push:
    # Kalau alat ukurnya sendiri diubah, langsung dibuktikan di jalur nyata.
    paths:
      - "monitor/**"
      - "src/**"
      - ".github/workflows/nameservers.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: nameservers
  cancel-in-progress: false

jobs:
  periksa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Put at job level so it can be used in a step `if:` — the `secrets` context
    # is not available in a step `if:`, but `env` is.
    env:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      WA_WEBHOOK: ${{ secrets.WA_WEBHOOK }}
    outputs:
      status: ${{ steps.monitor.outputs.status }}
      ringkas: ${{ steps.monitor.outputs.ringkas }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The assumption "a GitHub runner may send UDP 53 outbound" holds today, but must
      # not be trusted blindly: it is proven on every run. If GitHub (or an egress filter
      # such as harden-runner) ever closes port 53, this step goes red first and says why —
      # instead of the monitoring falsely accusing the nameserver of being down.
      - name: Prove the runner is fit to measure
        run: node monitor/capability.js

      - name: Check the production nameservers
        id: monitor
        env:
          ZONES: ${{ inputs.zones || 'a-i.sh,a-i.st' }}
          NAMESERVERS: ${{ inputs.nameservers || '' }}
          TRANSPORTS: ${{ inputs.transports || 'udp,tcp' }}
          # GitHub-hosted runners have no IPv6 route out. "auto" makes the v6 checks be
          # skipped with the reason recorded, not counted as failures. Switch to "on" if
          # this ever moves to a runner that genuinely has IPv6.
          IPV6: auto
          TIMEOUT: "4000"
          JSON_KE: hasil.json
        run: |
          set +e
          node monitor/check.js
          KODE=$?
          set -e
          case "$KODE" in
            0) STATUS=SEHAT ;;
            1) STATUS=BERMASALAH ;;
            3) STATUS=TIDAK_SAH ;;
            *) STATUS=ERROR ;;
          esac
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "ringkas=$(node -e 'const h=require("./hasil.json");console.log(`lulus ${h.lulus||0} gagal ${h.gagal||0}`)' 2>/dev/null || echo '-')" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "TIDAK_SAH" ]; then
            echo "::error title=Instrument problem::The runner network hijacks or blocks port 53. This is NOT a sign the nameserver is down — this run is invalid."
          fi
          [ "$KODE" -eq 0 ]

      - name: Store the raw result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-monitoring
          path: hasil.json
          retention-days: 30

      # A coloured README badge via shields.io "endpoint". Optional: if the secret
      # GIST_TOKEN belum diisi, langkah ini dilewati dan README tetap boleh pakai badge
      # bawaan GitHub (lihat docs/external-monitoring.md).
      - name: Update the badge (gist)
        if: always() && env.GIST_TOKEN != ''
        env:
          GIST_ID: ${{ vars.BADGE_GIST_ID }}
          STATUS: ${{ steps.monitor.outputs.status }}
          RINGKAS: ${{ steps.monitor.outputs.ringkas }}
        run: |
          case "$STATUS" in
            SEHAT)      PESAN="up"; WARNA="brightgreen" ;;
            BERMASALAH) PESAN="down"; WARNA="red" ;;
            TIDAK_SAH)  PESAN="unverified"; WARNA="lightgrey" ;;
            *)          PESAN="error"; WARNA="orange" ;;
          esac
          node -e '
            const [pesan, warna] = process.argv.slice(1);
            const isi = JSON.stringify({ schemaVersion: 1, label: "nameservers", message: pesan, color: warna });
            require("fs").writeFileSync("badge-payload.json", JSON.stringify({ files: { "nameservers.json": { content: isi } } }));
          ' "$PESAN" "$WARNA"
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" \
            -d @badge-payload.json > /dev/null

      # One incident issue, reused — not a new issue every 30 minutes.
      - name: Open or refresh the incident issue
        if: failure() && steps.monitor.outputs.status == 'BERMASALAH'
        env:
          GH_TOKEN: ${{ github.token }}
          JUDUL: "Nameserver bermasalah"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Label harus dipastikan ADA duluan. `gh issue create --label` gagal total
          # if the label was never created, and that failure means the incident is
          # never opened — an alarm that goes silent is more dangerous than no alarm
          # alarm sama sekali. Ini kejadian di run pertama (30687364149).
          gh label create monitoring --color B60205 \
            --description "Insiden dari monitoring nameserver terjadwal" 2>/dev/null || true

          NOMOR=$(gh issue list --state open --label monitoring --json number,title \
            --jq ".[] | select(.title==\"$JUDUL\") | .number" | head -1)
          BADAN="Monitoring terjadwal gagal. Detail: $RUN"
          if [ -n "$NOMOR" ]; then
            gh issue comment "$NOMOR" --body "$BADAN"
          else
            # Kalau pelabelan tetap gagal (mis. token tanpa izin label), issue-nya
            # HARUS tetap kebuka. Insiden tanpa label lebih baik daripada nol insiden.
            gh issue create --title "$JUDUL" --label monitoring --body "$BADAN" \
              || gh issue create --title "$JUDUL" --body "$BADAN"
          fi

      - name: Close the incident issue once recovered
        if: success() && steps.monitor.outputs.status == 'SEHAT'
        env:
          GH_TOKEN: ${{ github.token }}
          JUDUL: "Nameserver bermasalah"
        run: |
          # Deliberately NOT filtering by --label: if the labelling above failed, the issue
          # the incident exists but has no label, and a label filter would leave it
          # never closed — a ghost incident that sticks around forever. The title is
          # enough, and the title is reused on purpose.
          NOMOR=$(gh issue list --state open --json number,title \
            --jq ".[] | select(.title==\"$JUDUL\") | .number" | head -1)
          if [ -n "$NOMOR" ]; then
            gh issue close "$NOMOR" --comment "Pulih: monitoring terjadwal hijau lagi."
          fi

      # Notifikasi cepat ke WhatsApp lewat gateway sendiri (wafa.st / baleswa).
      # Deliberately separate from the INVALID condition: do not wake anyone at midnight
      # because the runner's own network was dirty.
      - name: Notify via WhatsApp
        if: failure() && steps.monitor.outputs.status == 'BERMASALAH' && env.WA_WEBHOOK != ''
        env:
          RINGKAS: ${{ steps.monitor.outputs.ringkas }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "$WA_WEBHOOK" \
            -H 'content-type: application/json' \
            -d "$(node -e 'console.log(JSON.stringify({ text: `Open-Domain: nameserver bermasalah (${process.env.RINGKAS}). ${process.env.RUN}` }))')" \
            > /dev/null
