# logrotate config for the query log.
# Deployed to /etc/logrotate.d/open-domain on the nameserver.
#
# The query log is only useful for following up an abuse report, and reports arrive in
# days, not years. 14 days is enough for that, and keeping it longer would only add GDPR
# obligation without adding capability. copytruncate is used so the process never has to
# be signalled or restarted for a rotation.
/var/log/open-domain/query.jsonl {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0640 opendomain nogroup
}
