# systemd drop-in for nginx, deployed to
# /etc/systemd/system/nginx.service.d/open-domain-limits.conf on the nameserver.
#
# The nameserver is currently the single point of failure for both zones. Putting a web
# server on the same machine means an HTTP problem could starve the DNS process of
# memory or CPU - the DNS would go down for a reason that has nothing to do with DNS.
#
# These limits make that impossible rather than unlikely. nginx here does nothing but
# issue redirects and serve ACME challenge files, so a few megabytes and a fraction of
# one core is already generous; anything beyond that is a symptom, not a need. The
# machine has 2 cores and ~3.8 GB, so what is reserved for DNS is the overwhelming
# majority of both.

[Service]
MemoryMax=192M
MemoryHigh=128M
CPUQuota=40%
TasksMax=64
