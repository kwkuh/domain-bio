# The apex redirect. Deployed to /etc/nginx/sites-available/open-domain-apex on the
# nameserver and symlinked into sites-enabled.
#
# A bare "a-i.st" or "a-i.sh" is the one name in either zone that a person types by
# hand; everything else in the zone is generated by a machine from an IP address. Left
# without an address it answered nothing at all, so the domain read as dead to anyone
# who tried it - the worst possible first impression for a service whose entire job is
# making addresses resolve. This sends those visitors to the documentation instead.
#
# It is a redirect, not a site. Nothing is served here beyond the ACME challenge, so
# there is no application to keep patched and nothing to break at three in the morning.
#
# Running any HTTP at all on the nameserver is a deliberate trade. This machine is
# currently the ONLY nameserver for both zones, so anything that can exhaust its
# resources takes DNS down with it. Two things keep that bounded: the systemd drop-in
# in nginx-limits.conf caps what nginx may consume no matter what arrives, and the
# request limits below blunt a flood before it reaches a worker.

# One shared limit for both zones. 10 requests/second with a burst of 20 is far above
# anything a human following a redirect needs, and far below anything that would matter
# to the DNS process sharing this machine.
limit_req_zone $binary_remote_addr zone=apex:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=apexconn:1m;

# Anything that arrives with a Host we do not serve - and on a public IP that is most
# of the traffic, essentially all of it automated - gets the connection closed with no
# reply. Without this, the redirects below would answer for ANY hostname pointed at
# this IP, which is exactly how an innocent redirect becomes someone else's open
# redirector. Note that this zone resolves its own address: 167.235.234.220.a-i.st
# points here too, and it lands in this block rather than in the redirect.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # Refuse the TLS handshake outright rather than presenting a certificate that does
    # not match the requested name. A scanner learns nothing, and this block needs no
    # certificate of its own.
    ssl_reject_handshake on;
    access_log off;
}

# ---- plain HTTP: the ACME challenge, and a redirect for everything else ----
server {
    listen 80;
    listen [::]:80;
    server_name a-i.st a-i.sh;

    # PRIVACY.md promises that addresses are truncated before they are stored. An nginx
    # access log would quietly record the full address of every visitor next to the DNS
    # log that carefully does not. Turning it off keeps the promise true.
    access_log off;

    # The ACME challenge has to stay on plain HTTP and must never be redirected, or the
    # certificate can never be renewed. This is the one path that is actually served.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        limit_req zone=apex burst=20 nodelay;
        limit_conn apexconn 10;
        return 301 https://open-domain.com$request_uri;
    }
}

# ---- HTTPS: one server block and one certificate PER ZONE ----
# Deliberately not a single certificate covering both names. The two zones are bought
# from different registries and renew independently; sharing a certificate would mean a
# renewal failure on one zone silently takes the other zone's HTTPS down with it. They
# have no reason to share a failure.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name a-i.st;
    access_log off;

    ssl_certificate     /etc/letsencrypt/live/a-i.st/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a-i.st/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:apexssl:2m;

    # No HSTS, and that is a decision rather than an omission. An HSTS header carrying
    # includeSubDomains on this apex would be a catastrophe: it would force HTTPS on
    # every *.a-i.st name our users create, and those are overwhelmingly plain-HTTP
    # development apps with no certificate at all. The blast radius is every user of
    # the service, and browsers would remember it for months. A redirect gains close to
    # nothing from HSTS. The trade is not worth taking.

    location / {
        limit_req zone=apex burst=20 nodelay;
        limit_conn apexconn 10;
        return 301 https://open-domain.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name a-i.sh;
    access_log off;

    ssl_certificate     /etc/letsencrypt/live/a-i.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a-i.sh/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:apexssl:2m;

    location / {
        limit_req zone=apex burst=20 nodelay;
        limit_conn apexconn 10;
        return 301 https://open-domain.com$request_uri;
    }
}
